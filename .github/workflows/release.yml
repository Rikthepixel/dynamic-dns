name: "Release"

on:
  release:
    types:
      - published

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USER }}/dynamic-dns


jobs:
  build:
    name: Publish on Dockerhub
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - client: mijndomein
            node_version: 24-bookworm
          - client: cloudflare

      fail-fast: true
    steps:
      - uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          flavor: latest=false
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.client }},enable=${{ !github.event.release.prerelease }}
            type=raw,value=${{ matrix.client }}-latest,enable=${{ !github.event.release.prerelease }}
            type=semver,pattern=${{ matrix.client }}-v{{version}}
            type=semver,pattern=${{ matrix.client }}-v{{major}}.{{minor}}
            type=semver,pattern=${{ matrix.client }}-v{{major}}

      - name: Build
        uses: docker/build-push-action@v7
        timeout-minutes: 10
        with:
          context: .
          push: true
          platforms: linux/amd64, linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CLIENT=${{ matrix.client }}
            NODE_VERSION=${{ matrix.node_version == null && '24-alpine' || matrix.node_version }}
